<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0c0c0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Check-in" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/img/app-icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/app-icon-192.png" />
<link rel="icon" href="assets/img/app-icon.svg" />
<title>Check-in — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/theme.css" />
<link rel="stylesheet" href="assets/css/checkin-app.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body class="ck-app">

  <!-- Splash -->
  <section id="tela-abrir" class="ck-tela ck-abrir">
    <div class="ck-abrir-marca">We<b>.events</b></div>
    <h1>Check-in</h1>
    <p>Carregando…</p>
  </section>

  <!-- Login -->
  <section id="tela-login" class="ck-tela ck-abrir" hidden>
    <div class="ck-abrir-marca">We<b>.events</b></div>
    <h1>Check-in</h1>
    <p>Entre com a conta da equipe.</p>
    <form id="form-login">
      <label>E-mail
        <input class="ck-input" id="login-email" type="email" autocomplete="username" required />
      </label>
      <label>Senha
        <input class="ck-input" id="login-senha" type="password" autocomplete="current-password" required />
      </label>
      <p class="ck-form-erro" id="login-erro" hidden></p>
      <button class="ck-btn ck-btn-primario" type="submit" id="login-btn">Entrar</button>
    </form>
  </section>

  <!-- Seleção de evento -->
  <section id="tela-eventos" class="ck-tela ck-lista-tela" hidden>
    <header class="ck-lista-topo">
      <div>
        <strong>Escolha o evento</strong>
        <span id="eventos-usuario" class="ck-lista-sub"></span>
      </div>
      <button class="ck-btn-txt" id="btn-sair">Sair</button>
    </header>
    <div class="ck-lista-corpo" id="eventos-lista"></div>
  </section>

  <!-- Tipo de check-in -->
  <section id="tela-modo" class="ck-tela ck-lista-tela" hidden>
    <header class="ck-lista-topo">
      <button class="ck-icone-btn ck-icone-btn-claro" id="modo-voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div>
        <strong>Tipo de check-in</strong>
        <span class="ck-lista-sub" id="modo-evento"></span>
      </div>
    </header>
    <div class="ck-lista-corpo">
      <button class="ck-modo-card" id="modo-evento-btn">
        <span class="ck-modo-ic">◎</span>
        <span class="ck-modo-txt"><strong>Check-in do evento</strong><span>Credencia e imprime o crachá</span></span>
      </button>
      <button class="ck-modo-card" id="modo-atividade-btn">
        <span class="ck-modo-ic">▤</span>
        <span class="ck-modo-txt"><strong>Check-in de atividade</strong><span>Controle de acesso a uma sessão / palestra</span></span>
      </button>
      <div id="modo-atividades" hidden>
        <p class="ck-lista-rotulo">Qual atividade?</p>
        <div id="modo-atividades-lista"></div>
      </div>
    </div>
  </section>

  <!-- Scanner -->
  <div id="app" hidden>
    <header class="ck-topo">
      <button class="ck-icone-btn" id="btn-trocar" aria-label="Trocar evento / modo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="ck-topo-info">
        <span class="ck-topo-evento" id="topo-evento">—</span>
        <span class="ck-topo-sub" id="topo-ctx">—</span>
      </div>
      <button class="ck-icone-btn" id="btn-buscar" aria-label="Buscar por nome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </header>

    <main class="ck-scanner" id="scanner-wrap">
      <div id="reader"></div>
      <div class="ck-mira" id="mira">
        <div class="ck-mira-quadro"><i></i><i></i><i></i><i></i></div>
        <p class="ck-mira-txt" id="mira-txt">Aponte para o QR Code do crachá</p>
      </div>
      <div class="ck-cam-erro" id="cam-erro" hidden>
        <p>Não consegui abrir a câmera.</p>
        <button class="ck-btn ck-btn-primario" id="btn-cam-retry">Permitir câmera</button>
        <button class="ck-btn ck-btn-fantasma" id="btn-cam-manual">Buscar por nome</button>
      </div>
    </main>

    <div class="ck-rodape">
      <button class="ck-btn ck-btn-grande" id="btn-manual-2">Buscar participante pelo nome</button>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="ck-sheet-fundo" id="sheet-fundo" hidden></div>
  <section class="ck-sheet" id="sheet" hidden aria-live="polite"></section>

  <!-- Busca manual -->
  <section class="ck-tela ck-busca" id="tela-busca" hidden>
    <header class="ck-busca-topo">
      <button class="ck-icone-btn" id="busca-voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <input class="ck-input" id="in-busca" placeholder="Nome, e-mail ou código" autocomplete="off" />
    </header>
    <div class="ck-busca-lista" id="busca-lista"></div>
  </section>

  <!-- Impressão do crachá -->
  <div id="cracha" hidden></div>

<script type="module" src="assets/js/checkin-app.js"></script>
</body>
</html>
