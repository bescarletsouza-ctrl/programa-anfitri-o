<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>try{var t=localStorage.getItem('tema')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.background=t==='dark'?'#0c0c0d':'#f7f7f6';}catch(e){}</script>
<script>try{if(!localStorage.getItem("sb-xiuhqkvkiexmbgwyvunr-auth-token")){try{sessionStorage.setItem("we_next",location.pathname+location.search);}catch(e){}location.replace("/login.html");}}catch(e){}</script>
<title>Atividades — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="conteudo">
    <div class="barra-topo">
      <div>
        <h1 class="pagina-titulo">Atividades</h1>
        <p class="pagina-sub">Palestras e sessões com vagas e categorias liberadas. O credenciamento em cada atividade é feito na tela de Check-in.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secundario" id="btn-atualizar">Atualizar</button>
        <button class="btn btn-primario" id="nova-atividade">+ Atividade</button>
      </div>
    </div>

    <div id="carregando" class="vazio">Carregando…</div>

    <div id="painel" hidden>
      <div id="lista" class="grid grid-2"></div>
      <div id="vazio" class="vazio" hidden>Nenhuma atividade cadastrada. Crie a primeira em “+ Atividade”.</div>
    </div>
  </main>
</div>
<div id="cracha" hidden></div>
<script type="module" src="../assets/js/atividades.js"></script>

</html>
