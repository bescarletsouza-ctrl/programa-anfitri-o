  <div class="eventos-tela">

    <div id="vazio" class="vazio" hidden>Nenhum evento ainda. Crie o primeiro.</div>

    <button class="btn btn-primario" id="btn-criar" style="margin-top:22px" hidden>+ Criar evento</button>
