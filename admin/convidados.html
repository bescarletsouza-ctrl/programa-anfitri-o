<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>try{var t=localStorage.getItem('tema')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.background=t==='dark'?'#0c0c0d':'#f7f7f6';}catch(e){}</script>
<script>try{if(!localStorage.getItem("sb-xiuhqkvkiexmbgwyvunr-auth-token")){try{sessionStorage.setItem("we_next",location.pathname+location.search);}catch(e){}location.replace("/login.html");}}catch(e){}</script>
<title>Convidados — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="conteudo">
    <div class="barra-topo">
      <div>
        <h1 class="pagina-titulo">Gestão de convidados</h1>
        <p class="pagina-sub">Aplicações dos convidados indicados pelos anfitriões.</p>
      </div>
      <button class="btn btn-primario" id="btn-novo">+ Novo convidado</button>
    </div>

    <div class="barra-topo" style="margin-bottom:12px">
      <div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-sm btn-secundario" id="btn-toggle-filtros" aria-expanded="false">Filtros</button>
      </div>
    </div>

    <section class="filtros-painel" id="filtros-painel" hidden>
      <div class="filtros-cab">
        <strong>Filtros</strong>
        <button class="btn btn-sm btn-fantasma" id="btn-limpar-filtros">Limpar tudo</button>
      </div>
      <div class="filtros-grupo">
        <div class="filtros-linha">
          <label class="campo"><span>Pesquisar</span>
            <input class="input" id="busca" placeholder="Nome, e-mail ou empresa…" /></label>
          <label class="campo"><span>Status</span>
            <select class="select" id="f-status"><option value="">Todos os status</option></select></label>
          <label class="campo"><span>Grupo</span>
            <select class="select" id="f-grupo"><option value="">Todos os grupos</option></select></label>
        </div>
      </div>
    </section>

    <div class="grid grid-4" id="pills" style="margin-bottom:16px"></div>

    <div class="barra-acoes" id="barra-acoes" hidden>
      <span class="barra-acoes-cont" id="sel-cont">0 selecionados</span>
      <button class="btn btn-sm btn-secundario" data-acao="aprovar">Aprovar</button>
      <button class="btn btn-sm btn-secundario" data-acao="reprovar">Reprovar</button>
      <button class="btn btn-sm btn-fantasma" data-acao="limpar">Limpar seleção</button>
    </div>

    <div id="carregando" class="vazio">Carregando…</div>
    <div class="tabela-wrap" id="wrap" hidden>
      <table class="tabela tabela-part">
        <thead><tr>
          <th class="col-check"><input type="checkbox" id="check-todos" aria-label="Selecionar todos" /></th>
          <th>Convidado</th><th>Empresa</th><th>Convidado por</th>
          <th>Telefone</th><th>Status</th><th>Situação</th><th>Data</th><th></th>
        </tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <div id="vazio" class="vazio" hidden>Nenhum convidado encontrado.</div>
  </main>
</div>
<script type="module" src="../assets/js/convidados.js"></script>
</body>
</html>
