<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>try{var t=localStorage.getItem('tema')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.background=t==='dark'?'#0c0c0d':'#f7f7f6';}catch(e){}</script>
<script>try{if(!localStorage.getItem("sb-xiuhqkvkiexmbgwyvunr-auth-token"))location.replace("/login.html?next="+encodeURIComponent(location.pathname+location.search));}catch(e){}</script>
<title>Participantes — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="conteudo">
    <div class="barra-topo">
      <div>
        <h1 class="pagina-titulo">Participantes</h1>
        <p class="pagina-sub">Lista de presença e pipeline do evento.</p>
      </div>
      <div class="toggle-abas" id="vistas">
        <button data-vista="lista" class="ativo">Lista</button>
        <button data-vista="pipeline">Pipeline</button>
      </div>
    </div>

    <div id="carregando" class="vazio">Carregando…</div>

    <!-- ================= BARRA + FILTROS (compartilhado) ================= -->
    <div id="conteudo-part" hidden>
      <div class="barra-topo" style="margin-bottom:12px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primario" id="btn-cadastrar">+ Cadastrar</button>
          <button class="btn btn-secundario" id="btn-nova-etapa" hidden>+ Etapa</button>
          <button class="btn btn-secundario" id="btn-importar">Importar Excel</button>
          <button class="btn btn-secundario" id="btn-exportar">Exportar Excel</button>
          <button class="btn btn-secundario" id="btn-email">Enviar e-mail</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="pagina-sub" id="contador" style="margin:0"></span>
          <button class="btn btn-sm btn-secundario" id="btn-colunas">Colunas</button>
          <button class="btn btn-sm btn-secundario" id="btn-toggle-filtros" aria-expanded="false">Filtros</button>
        </div>
      </div>

      <section class="filtros-painel" id="filtros-painel" hidden>
        <div class="filtros-cab">
          <strong>Filtros</strong>
          <button class="btn btn-sm btn-fantasma" id="btn-limpar-filtros">Limpar tudo</button>
        </div>

        <div class="filtros-grupo">
          <h5>Pesquisa</h5>
          <div class="filtros-linha">
            <label class="campo"><span>Pesquisar</span>
              <input class="input" id="f-busca" placeholder="Nome, e-mail, telefone, empresa ou código…" /></label>
            <label class="campo"><span>Limitar aos campos</span>
              <select class="select" id="f-campo">
                <option value="">Todos os campos</option>
                <option value="nome">Nome</option>
                <option value="email">E-mail</option>
                <option value="telefone">Telefone</option>
                <option value="empresa">Empresa</option>
                <option value="codigo">Código</option>
              </select></label>
          </div>
        </div>

        <div class="filtros-grupo">
          <h5>Situação &amp; datas</h5>
          <div class="filtros-linha">
            <label class="campo"><span>Situação</span><select class="select" id="f-situacao"></select></label>
            <label class="campo"><span>Tipo</span><select class="select" id="f-tipo"></select></label>
            <label class="campo"><span>Pagamento</span><select class="select" id="f-pagamento"></select></label>
            <label class="campo"><span>Cadastro de</span><input class="input" id="f-data-de" type="date" /></label>
            <label class="campo"><span>Cadastro até</span><input class="input" id="f-data-ate" type="date" /></label>
          </div>
        </div>

        <div class="filtros-grupo">
          <h5>Inscrições &amp; presença</h5>
          <div class="filtros-linha">
            <label class="campo"><span>Categoria de ingresso</span><select class="select" id="f-categoria"><option value="">Todas</option></select></label>
            <label class="campo"><span>Etapa do pipeline</span><select class="select" id="f-etapa"><option value="">Todas</option></select></label>
            <label class="campo"><span>Atividade</span><select class="select" id="f-atividade"><option value="">Não filtrar</option></select></label>
            <label class="campo"><span>Pres. atividade</span>
              <select class="select" id="f-pres-atv">
                <option value="">Não filtrar</option>
                <option value="sim">Credenciado</option>
                <option value="nao">Não credenciado</option>
              </select></label>
            <label class="campo"><span>Pres. evento</span>
              <select class="select" id="f-presenca">
                <option value="">Não filtrar</option>
                <option value="sim">Presente</option>
                <option value="nao">Ausente</option>
              </select></label>
          </div>
        </div>
      </section>
    </div>

    <!-- ================= LISTA ================= -->
    <div id="vista-lista" hidden>
      <div class="barra-acoes" id="barra-acoes" hidden>
        <span class="barra-acoes-cont" id="sel-cont">0 selecionados</span>
        <button class="btn btn-sm btn-secundario" data-acao="email">Enviar e-mail</button>
        <button class="btn btn-sm btn-secundario" data-acao="presente">Marcar presente</button>
        <button class="btn btn-sm btn-secundario" data-acao="ausente">Marcar ausente</button>
        <button class="btn btn-sm btn-secundario" data-acao="situacao">Situação</button>
        <button class="btn btn-sm btn-secundario" data-acao="tipo">Tipo</button>
        <button class="btn btn-sm btn-secundario" data-acao="pagamento">Pagamento</button>
        <button class="btn btn-sm btn-secundario" data-acao="etapa">Etapa</button>
        <button class="btn btn-sm btn-secundario" data-acao="exportar">Exportar</button>
        <button class="btn btn-sm btn-perigo" data-acao="excluir">Excluir</button>
        <button class="btn btn-sm btn-fantasma" data-acao="limpar">Limpar seleção</button>
      </div>

      <div class="tabela-wrap" id="wrap" hidden>
        <table class="tabela tabela-part">
          <thead><tr id="thead-part"></tr></thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
      <div id="vazio" class="vazio" hidden>Nenhum participante encontrado.</div>
      <div class="paginacao" id="paginacao" hidden></div>
    </div>

    <!-- ================= PIPELINE ================= -->
    <div id="vista-pipeline" hidden>
      <div class="kanban" id="kanban"></div>
    </div>
  </main>
</div>
<div id="cracha" hidden></div>
<script type="module" src="../assets/js/participantes.js"></script>
</body>
</html>
