<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>try{var t=localStorage.getItem('tema')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.background=t==='dark'?'#0c0c0d':'#f7f7f6';}catch(e){}</script>
<script>try{if(!localStorage.getItem("sb-xiuhqkvkiexmbgwyvunr-auth-token")){try{sessionStorage.setItem("we_next",location.pathname+location.search);}catch(e){}location.replace("/login.html");}}catch(e){}</script>
<title>Check-in — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="conteudo">
    <div class="barra-topo">
      <div>
        <h1 class="pagina-titulo">Check-in</h1>
        <p class="pagina-sub">Credenciamento na entrada do evento.</p>
      </div>
      <button class="btn btn-secundario" id="btn-atualizar">Atualizar</button>
    </div>

    <div id="carregando" class="vazio">Carregando…</div>

    <div id="painel" hidden>
      <div class="ck-layout" id="ck-layout">
        <div class="ck-main">
          <div class="ck-busca-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="input" id="busca" placeholder="Procure por nome, e-mail, telefone, código ou empresa" autocomplete="off" autofocus />
          </div>
          <div id="resultados" class="checkin-lista"></div>
          <div id="dica" class="ck-vazio">Digite algo para buscar…</div>
        </div>

        <aside class="ck-rail">
          <label class="campo" id="alvo-wrap" hidden>
            <span>Credenciar em</span>
            <select class="select" id="alvo"></select>
          </label>

          <button type="button" class="ck-stat ck-stat-ok" data-fstat="presentes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="lbl-presentes">Presentes</span> <b id="n-presentes">0</b>
          </button>
          <button type="button" class="ck-stat ck-stat-alerta" data-fstat="">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="lbl-total">Total</span> <b id="n-total">0</b>
          </button>
          <button type="button" class="ck-stat ck-stat-neutro" data-fstat="ausentes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M6 2v5a6 6 0 0 0 4 5.7 6 6 0 0 0-4 5.7V22M18 2v5a6 6 0 0 1-4 5.7 6 6 0 0 1 4 5.7V22"/></svg>
            <span id="lbl-ausentes">Ausentes</span> <b id="n-ausentes">0</b>
          </button>

          <div class="ck-cats-titulo">Categorias de ingresso</div>
          <div class="ck-cats" id="ck-cats"></div>

          <label class="ck-toggle"><input type="checkbox" id="ck-detalhes" /> Exibir detalhes de contato</label>
        </aside>
      </div>
    </div>
  </main>
</div>
<div id="cracha" hidden></div>
<script type="module" src="../assets/js/checkin.js"></script>
</body>
</html>
