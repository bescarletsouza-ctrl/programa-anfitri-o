<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>try{var t=localStorage.getItem('tema')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.background=t==='dark'?'#0c0c0d':'#f7f7f6';}catch(e){}</script>
<script>try{if(!localStorage.getItem("sb-xiuhqkvkiexmbgwyvunr-auth-token")){try{sessionStorage.setItem("we_next",location.pathname+location.search);}catch(e){}location.replace("/login.html");}}catch(e){}</script>
<title>Plataforma — We.events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/theme.css" />
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="conteudo">
    <div class="barra-topo">
      <div>
        <h1 class="pagina-titulo">Plataforma</h1>
        <p class="pagina-sub">Organizações (clientes), limites de plano e usuários. Só você vê esta tela.</p>
      </div>
      <button class="btn btn-primario" id="btn-nova">+ Nova organização</button>
    </div>

    <div id="carregando" class="vazio">Carregando…</div>

    <div id="painel" hidden>
      <div class="grid grid-4" id="kpis" style="margin-bottom:24px"></div>
      <div class="tabela-wrap">
        <table class="tabela">
          <thead><tr>
            <th>Empresa</th><th>Ramo</th><th>Acesso</th>
            <th class="num">Membros</th><th class="num">Eventos</th>
            <th>Expira</th><th>Status</th><th></th>
          </tr></thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
      <div id="vazio" class="vazio" hidden>Nenhuma organização ainda. Crie a primeira.</div>
    </div>
  </main>
</div>
<script type="module" src="../assets/js/plataforma.js"></script>
</body>
</html>
